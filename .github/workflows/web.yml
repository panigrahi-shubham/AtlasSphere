name: Web verification
on:
  push:
  pull_request:
  schedule:
    - cron: '31 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: skyatlas
          POSTGRES_PASSWORD: skyatlas_test
          POSTGRES_DB: skyatlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U skyatlas" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://skyatlas:skyatlas_test@localhost:5432/skyatlas_test
      AUTH_SECRET: ci-test-secret-only-change-me-32-characters-minimum
      APP_ENV: test
      FIXTURES: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
      - run: npm run check:syntax && npm run typecheck:api && npm run build && npm test
      - name: React homepage static and unit verification
        run: npm run typecheck:home && npm run lint:home && npm run format:home:check && npm run test:home:unit
      - name: Framework static verification
        run: npm run lint:tests && npm run typecheck:tests && npm run check:links
      - name: Assertion preservation audit
        run: node scripts/audit-assertions.mjs "$ASSERTION_BASE"
        env:
          ASSERTION_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:api:local
      - name: React homepage desktop, touch and accessibility
        run: npm run test:home
      - name: Production homepage hydration and static content
        run: npm run test:home
        env:
          HOME_PRODUCTION: '1'
      - name: Persistence smoke against the test database
        run: npm run test:smoke:prod
        env:
          SKYATLAS_SMOKE_LOCAL: '1'
          SKYATLAS_URL: http://127.0.0.1:31423
          PORT: '31423'
      - name: Account retry, privacy and journeys browser checks
        run: npx playwright test --project=ui tests/ui/journeys/account-privacy.spec.ts tests/ui/journeys/trips-alerts-reviews.spec.ts
      - run: npm run test:smoke
      - run: npm run test:a11y
      - run: npm run test:bugs
      - run: npm run test:release
      - run: npm run test:v2
      - name: Summarize test suites
        if: always()
        run: node scripts/summarize-tests.mjs
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
  nightly-cross-browser:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:cross-browser
      - run: npm run test:ui -- --workers=2
      - run: npm run build && npm run audit:web
      - name: Summarize test suites
        if: always()
        run: node scripts/summarize-tests.mjs
      - name: Upload cross-browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-cross-browser
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
          if-no-files-found: ignore
