# Configure DATABASE_URL through Render secrets before deploying accounts.
# The referenced database must already exist; this blueprint creates no paid resource.
# Add OPEN_METEO_API_KEY in the Render dashboard only if a Professional or Enterprise
# Historical Weather API subscription is configured; it is optional and server-only.
services:
  - type: web
    name: skyatlas
    runtime: node
    buildCommand: npm ci && npm run prisma:generate && npm run prisma:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
